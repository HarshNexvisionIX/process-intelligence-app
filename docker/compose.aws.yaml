services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      PM_PROFILE: aws
      DATA_DIR: /data
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3.5-27B}
      VLLM_API_KEY: ${VLLM_API_KEY:-local-only}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-process-mining}
      ALLOW_EXTERNAL_AI: "false"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - /data:/data
    networks:
      - private
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/health.py", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.33.0}
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3.5-27B}", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-local-only}
    expose:
      - "8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      private:
        aliases:
          - vllm.internal

volumes:
  vllm_models:

networks:
  private: {}
